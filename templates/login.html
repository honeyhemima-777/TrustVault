
<!DOCTYPE html>
<html>
<head>
    <title>TrustVault Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: white;
            padding: 35px;
            width: 320px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #ccc;
        }
        h2 {
            color: #1e40af;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #1e40af;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>TrustVault Login</h2>
        {% if error %}
        <p style="color:red;">{{ error }}</p>
        {% endif %}
        <form method="POST" action="/login">
            <input type="text" name="username"
                   placeholder="Username" required>
            <input type="password" name="password"
                   placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
